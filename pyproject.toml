[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "u820-monitor"
version = "0.2.0"
description = "Ubuntu U820 sensor monitoring and quiet temperature-based fan control"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/gaiar/minisforum-u820-linux-fan-control"
Documentation = "https://github.com/gaiar/minisforum-u820-linux-fan-control/blob/main/docs/configuration.md"
Issues = "https://github.com/gaiar/minisforum-u820-linux-fan-control/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[project.scripts]
u820-monitor = "u820_monitor:main"
u820-fan = "u820_fan:main"

[tool.setuptools]
py-modules = ["u820_monitor", "u820_fan"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["u820_monitor.py", "u820_fan.py"]

[tool.pytest.ini_options]
addopts = "--cov=u820_monitor --cov=u820_fan --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
